services:
  postgres:
    image: postgres:15-alpine
    container_name: test_api_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_api_backend
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: host=postgres user=admin password=rahasia dbname=appdb port=5432 sslmode=disable
      SECRET_KEY: ASEDEKNTLAHAAHA464690901212
      PORT: 8082
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
